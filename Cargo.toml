[workspace]
resolver = "2"
members = ["crates/nsetick-core", "crates/nsetick-io", "crates/nsetick-cli", "crates/nsetick-py", "crates/nsetick-book"]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/arnav127/nsetick"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
nsetick-core = { path = "crates/nsetick-core" }
nsetick-io = { path = "crates/nsetick-io" }
nsetick-book = { path = "crates/nsetick-book" }
nsetick-cli = { path = "crates/nsetick-cli" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
