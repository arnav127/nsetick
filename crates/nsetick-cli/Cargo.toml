[package]
name = "nsetick-cli"
description = "Command line interface for nsetick"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nsetick_cli"
path = "src/lib.rs"

[[bin]]
name = "nsetick"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arrow = { version = "59.3.0", default-features = false }
chrono.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
mimalloc = "0.1.52"
nsetick-core.workspace = true
nsetick-io.workspace = true
nsetick-book.workspace = true
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "zstd", "snap", "lz4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
