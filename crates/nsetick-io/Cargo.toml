[package]
name = "nsetick-io"
description = "Gzip reading and partitioned Parquet writing for NSE historical tick data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Link zlib-ng instead of the pure-Rust inflate. Roughly 2x faster, but it needs cmake on
# the build machine, so it is opt-in rather than the default.
zlib-ng = ["flate2/zlib-ng"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
nsetick-core.workspace = true
arrow = { version = "59.3.0", default-features = false }
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "zstd"] }
flate2 = "1.1.10"
crossbeam-channel = "0.5.17"
serde_json = "1.0.151"
