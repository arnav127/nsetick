[package]
name = "nsetick-py"
description = "Python bindings for nsetick"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
arrow = { version = "59.3.0", default-features = false, features = ["pyarrow"] }
chrono.workspace = true
nsetick-core.workspace = true
nsetick-io.workspace = true
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "zstd", "snap", "lz4"] }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py39"] }
