[package]
name = "nsetick-book"
description = "Limit order book reconstruction and L2 snapshots for NSE order-level data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
nsetick-core.workspace = true
nsetick-io.workspace = true
chrono.workspace = true
arrow = { version = "59.3.0", default-features = false }
crossbeam-channel = "0.5.17"
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "zstd", "snap", "lz4"] }
