# NSE Capital Market — Order-level (MBO) records.
# Source of truth: "Historical Data Orders and Trade Layout" v1.10 (27 Jul 2022), section 1.1.
# Offsets are 0-based byte offsets into the record, excluding the LF delimiter.

[layout]
id          = "cm_orders"
segment     = "CM"
kind        = "orders"
description = "Cash Market Orders Data — one record per order entry/modify/cancel"
delimiter   = "LF"
file_glob   = "CASH_Orders_{date}*.DAT.gz"
split_files = false

[[version]]
spec_version   = "1.0"
valid_from     = 2007-12-24
valid_to       = 9999-12-31
record_length  = 87
fields = [
  { name = "record_indicator", offset =  0, len =  2, type = "str",     values = ["RM", "PO"], doc = "RM = Regular Market, PO = Pre-Open" },
  { name = "segment",          offset =  2, len =  4, type = "str",     values = ["CASH"] },
  { name = "order_number",     offset =  6, len = 16, type = "u64",     doc = "Unique order identifier" },
  { name = "txn_time",         offset = 22, len = 14, type = "jiffies", doc = "65536 jiffies = 1s, epoch 1980-01-01" },
  { name = "buy_sell",         offset = 36, len =  1, type = "str",     values = ["B", "S"] },
  { name = "activity_type",    offset = 37, len =  1, type = "u8",      values = [1, 3, 4], doc = "1 = Entry, 3 = Cancel, 4 = Modify" },
  { name = "symbol",           offset = 38, len = 10, type = "str",     pad = "left", doc = "Right-aligned; see spec/README.md on 'b' padding" },
  { name = "series",           offset = 48, len =  2, type = "str",     doc = "EQ, BE, BL, DR, GC, IL, MF, N1..NQ, P1, P2, Q2, RL, W1, W2 and others observed in the wild" },
  { name = "volume_disclosed", offset = 50, len =  8, type = "u64",     doc = "0 for non-disclosed-quantity orders" },
  { name = "volume_original",  offset = 58, len =  8, type = "u64",     doc = "Total order quantity; > volume_disclosed implies an iceberg" },
  { name = "limit_price",      offset = 66, len =  8, type = "price", scale = 2, doc = "In paise" },
  { name = "trigger_price",    offset = 74, len =  8, type = "price", scale = 2, doc = "In paise; 0 for non-stop-loss orders" },
  { name = "mkt_order_flag",   offset = 82, len =  1, type = "bool_yn", doc = "Y = Market order, N = Limit order" },
  { name = "stop_loss_flag",   offset = 83, len =  1, type = "bool_yn" },
  { name = "ioc_flag",         offset = 84, len =  1, type = "bool_yn" },
  { name = "algo_indicator",   offset = 85, len =  1, type = "u8",      values = [0, 1, 2, 3], doc = "0 = Algo, 1 = Non-Algo, 2 = Algo via SOR, 3 = Non-Algo via SOR" },
  { name = "client_identity",  offset = 86, len =  1, type = "u8",      values = [1, 2, 3], doc = "1 = CP (custodian), 2 = Prop, 3 = Non-CP non-Prop" },
]
