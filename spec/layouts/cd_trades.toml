# NSE Currency Derivatives - Trade records.
# Source of truth: "Historical Data Orders and Trade Layout" v1.10 (27 Jul 2022), section 3.2.
#
# Note: unlike FAO trades, the CD trade number stayed 16 bytes, so the record is 123 bytes
# and there is no 2020 changeover. Prices are scale 4 (see cd_orders.toml).

[layout]
id          = "cd_trades"
segment     = "CD"
kind        = "trades"
description = "Currency Derivatives Market Trades Data"
delimiter   = "LF"
file_glob   = "CDS_Trades_{date}*.DAT.gz"
split_files = false

[[version]]
spec_version  = "1.0"
valid_from    = 2008-08-24
valid_to      = 9999-12-31
record_length = 123
verified      = false
fields = [
  { name = "record_indicator",     offset =   0, len =  2, type = "str", values = ["RM"] },
  { name = "segment",              offset =   2, len =  4, type = "str", pad = "right", values = ["CDS"] },
  { name = "trade_number",         offset =   6, len = 16, type = "u64" },
  { name = "txn_time",             offset =  22, len = 14, type = "jiffies" },
  { name = "symbol",               offset =  36, len = 10, type = "str", pad = "left" },
  { name = "instrument",           offset =  46, len =  6, type = "str", values = ["FUTCUR", "OPTCUR"] },
  { name = "expiry_date",          offset =  52, len =  9, type = "date_dmmmy" },
  { name = "strike_price",         offset =  61, len =  8, type = "price", scale = 4 },
  { name = "option_type",          offset =  69, len =  2, type = "str", values = ["CA", "PA", "CE", "PE", "FF"] },
  { name = "trade_price",          offset =  71, len =  8, type = "price", scale = 4 },
  { name = "trade_quantity",       offset =  79, len =  8, type = "u64", doc = "Lots/contracts" },
  { name = "buy_order_number",     offset =  87, len = 16, type = "u64" },
  { name = "buy_algo_indicator",   offset = 103, len =  1, type = "u8", values = [0, 1, 2, 3] },
  { name = "buy_client_identity",  offset = 104, len =  1, type = "u8", values = [1, 2, 3] },
  { name = "sell_order_number",    offset = 105, len = 16, type = "u64" },
  { name = "sell_algo_indicator",  offset = 121, len =  1, type = "u8", values = [0, 1, 2, 3] },
  { name = "sell_client_identity", offset = 122, len =  1, type = "u8", values = [1, 2, 3] },
]
