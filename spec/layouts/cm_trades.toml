# NSE Capital Market — Trade records.
# Source of truth: "Historical Data Orders and Trade Layout" v1.10 (27 Jul 2022), section 1.2.

[layout]
id          = "cm_trades"
segment     = "CM"
kind        = "trades"
description = "Cash Market Trades Data — one record per executed trade"
delimiter   = "LF"
file_glob   = "CASH_Trades_{date}*.DAT.gz"
split_files = false

[[version]]
spec_version  = "1.0"
valid_from    = 2007-12-24
valid_to      = 9999-12-31
record_length = 100
fields = [
  { name = "record_indicator",      offset =  0, len =  2, type = "str", values = ["RM", "PO"] },
  { name = "segment",               offset =  2, len =  4, type = "str", values = ["CASH"] },
  { name = "trade_number",          offset =  6, len = 16, type = "u64" },
  { name = "txn_time",              offset = 22, len = 14, type = "jiffies" },
  { name = "symbol",                offset = 36, len = 10, type = "str", pad = "left" },
  { name = "series",                offset = 46, len =  2, type = "str" },
  { name = "trade_price",           offset = 48, len =  8, type = "price", scale = 2 },
  { name = "trade_quantity",        offset = 56, len =  8, type = "u64" },
  { name = "buy_order_number",      offset = 64, len = 16, type = "u64" },
  { name = "buy_algo_indicator",    offset = 80, len =  1, type = "u8", values = [0, 1, 2, 3] },
  { name = "buy_client_identity",   offset = 81, len =  1, type = "u8", values = [1, 2, 3] },
  { name = "sell_order_number",     offset = 82, len = 16, type = "u64" },
  { name = "sell_algo_indicator",   offset = 98, len =  1, type = "u8", values = [0, 1, 2, 3] },
  { name = "sell_client_identity",  offset = 99, len =  1, type = "u8", values = [1, 2, 3] },
]
