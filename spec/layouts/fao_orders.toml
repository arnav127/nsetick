# NSE Futures & Options - Order-level (MBO) records.
# Source of truth: "Historical Data Orders and Trade Layout" v1.10 (27 Jul 2022), section 2.1.
#
# Two record versions exist. Spec revision 1.7 (16 Dec 2021) appended the Limit Price
# Indicator flag, taking the record from 111 to 112 bytes. The exact changeover date in the
# data feed is not stated in the PDF; 2021-12-16 is the revision date and is used as the
# boundary. nsetick auto-detects the version from observed record length and will report a
# mismatch rather than silently mis-slicing, so an imprecise boundary is self-correcting.
#
# NOTE: volumes are in NUMBER OF SHARES, not contracts (unlike the CD segment).

[layout]
id          = "fao_orders"
segment     = "FAO"
kind        = "orders"
description = "Equity Derivatives Market Orders Data"
delimiter   = "LF"
file_glob   = "FAO_Orders_{date}*.DAT.gz"
split_files = true   # FAO is split into _01.._nn streams; contracts do not overlap across files

[[version]]
spec_version  = "1.7"
valid_from    = 2021-12-16
valid_to      = 9999-12-31
record_length = 112
fields = [
  { name = "record_indicator", offset =   0, len =  2, type = "str", values = ["RM"] },
  { name = "segment",          offset =   2, len =  4, type = "str", pad = "right", values = ["FAO"], doc = "Emitted as 'FAOb' - trailing pad" },
  { name = "order_number",     offset =   6, len = 16, type = "u64" },
  { name = "txn_time",         offset =  22, len = 14, type = "jiffies" },
  { name = "buy_sell",         offset =  36, len =  1, type = "str", values = ["B", "S"] },
  { name = "activity_type",    offset =  37, len =  1, type = "u8", values = [1, 3, 4] },
  { name = "symbol",           offset =  38, len = 10, type = "str", pad = "left", doc = "Underlying symbol" },
  { name = "instrument",       offset =  48, len =  6, type = "str", values = ["FUTIDX", "OPTIDX", "FUTSTK", "OPTSTK"] },
  { name = "expiry_date",      offset =  54, len =  9, type = "date_dmmmy", doc = "ddMMMyyyy, e.g. 28JUN2012" },
  { name = "strike_price",     offset =  63, len =  8, type = "price", scale = 2, doc = "0 for futures" },
  { name = "option_type",      offset =  71, len =  2, type = "str", values = ["CA", "PA", "CE", "PE", "FF"], doc = "FF = futures contract" },
  { name = "volume_disclosed", offset =  73, len =  8, type = "u64", doc = "Shares, not contracts" },
  { name = "volume_original",  offset =  81, len =  8, type = "u64", doc = "Shares, not contracts" },
  { name = "limit_price",      offset =  89, len =  8, type = "price", scale = 2, doc = "May be 0 for spread orders (spread value between two contracts' LTP)" },
  { name = "trigger_price",    offset =  97, len =  8, type = "price", scale = 2 },
  { name = "mkt_order_flag",   offset = 105, len =  1, type = "bool_yn" },
  { name = "stop_loss_flag",   offset = 106, len =  1, type = "bool_yn" },
  { name = "ioc_flag",         offset = 107, len =  1, type = "bool_yn" },
  { name = "spread_type",      offset = 108, len =  1, type = "str", values = ["S", "2", "3", "*"], doc = "S = spread, 2/3 = leg count, * = non-spread" },
  { name = "algo_indicator",   offset = 109, len =  1, type = "u8", values = [0, 1, 2, 3] },
  { name = "client_identity",  offset = 110, len =  1, type = "u8", values = [1, 2, 3] },
  { name = "limit_price_ind",  offset = 111, len =  1, type = "bool_yn", doc = "Y = positive limit price, N = negative. Added in spec 1.7" },
]

[[version]]
spec_version  = "1.6"
valid_from    = 2007-12-24
valid_to      = 2021-12-15
record_length = 111
verified      = false   # no pre-2021-12 FAO sample available locally
fields = [
  { name = "record_indicator", offset =   0, len =  2, type = "str", values = ["RM"] },
  { name = "segment",          offset =   2, len =  4, type = "str", pad = "right", values = ["FAO"] },
  { name = "order_number",     offset =   6, len = 16, type = "u64" },
  { name = "txn_time",         offset =  22, len = 14, type = "jiffies" },
  { name = "buy_sell",         offset =  36, len =  1, type = "str", values = ["B", "S"] },
  { name = "activity_type",    offset =  37, len =  1, type = "u8", values = [1, 3, 4] },
  { name = "symbol",           offset =  38, len = 10, type = "str", pad = "left" },
  { name = "instrument",       offset =  48, len =  6, type = "str", values = ["FUTIDX", "OPTIDX", "FUTSTK", "OPTSTK"] },
  { name = "expiry_date",      offset =  54, len =  9, type = "date_dmmmy" },
  { name = "strike_price",     offset =  63, len =  8, type = "price", scale = 2 },
  { name = "option_type",      offset =  71, len =  2, type = "str", values = ["CA", "PA", "CE", "PE", "FF"] },
  { name = "volume_disclosed", offset =  73, len =  8, type = "u64" },
  { name = "volume_original",  offset =  81, len =  8, type = "u64" },
  { name = "limit_price",      offset =  89, len =  8, type = "price", scale = 2 },
  { name = "trigger_price",    offset =  97, len =  8, type = "price", scale = 2 },
  { name = "mkt_order_flag",   offset = 105, len =  1, type = "bool_yn" },
  { name = "stop_loss_flag",   offset = 106, len =  1, type = "bool_yn" },
  { name = "ioc_flag",         offset = 107, len =  1, type = "bool_yn" },
  { name = "spread_type",      offset = 108, len =  1, type = "str", values = ["S", "2", "3", "*"] },
  { name = "algo_indicator",   offset = 109, len =  1, type = "u8", values = [0, 1, 2, 3] },
  { name = "client_identity",  offset = 110, len =  1, type = "u8", values = [1, 2, 3] },
]
