# NSE Currency Derivatives - Order-level (MBO) records.
# Source of truth: "Historical Data Orders and Trade Layout" v1.10 (27 Jul 2022), section 3.1.
#
# IMPORTANT - two ways CD differs from CM/FAO, both of which silently corrupt analysis if
# a CM/FAO-shaped parser is reused here:
#   1. Prices carry FOUR decimal places (scale = 4), not two. 12.3456 is encoded "00123456".
#      Applying the CM paise/100 rule overstates every CD price by 100x.
#   2. Volumes are in LOTS (contracts), not shares.

[layout]
id          = "cd_orders"
segment     = "CD"
kind        = "orders"
description = "Currency Derivatives Market Orders Data"
delimiter   = "LF"
file_glob   = "CDS_Orders_{date}*.DAT.gz"
split_files = false

[[version]]
spec_version  = "1.7"
valid_from    = 2021-12-16
valid_to      = 9999-12-31
record_length = 112
verified      = false
fields = [
  { name = "record_indicator", offset =   0, len =  2, type = "str", values = ["RM"] },
  { name = "segment",          offset =   2, len =  4, type = "str", pad = "right", values = ["CDS"], doc = "Emitted as 'CDSb'" },
  { name = "order_number",     offset =   6, len = 16, type = "u64" },
  { name = "txn_time",         offset =  22, len = 14, type = "jiffies" },
  { name = "buy_sell",         offset =  36, len =  1, type = "str", values = ["B", "S"] },
  { name = "activity_type",    offset =  37, len =  1, type = "u8", values = [1, 3, 4] },
  { name = "symbol",           offset =  38, len = 10, type = "str", pad = "left" },
  { name = "instrument",       offset =  48, len =  6, type = "str", values = ["FUTCUR", "OPTCUR"] },
  { name = "expiry_date",      offset =  54, len =  9, type = "date_dmmmy" },
  { name = "strike_price",     offset =  63, len =  8, type = "price", scale = 4 },
  { name = "option_type",      offset =  71, len =  2, type = "str", values = ["CA", "PA", "CE", "PE", "FF"] },
  { name = "volume_disclosed", offset =  73, len =  8, type = "u64", doc = "Lots/contracts" },
  { name = "volume_original",  offset =  81, len =  8, type = "u64", doc = "Lots/contracts" },
  { name = "limit_price",      offset =  89, len =  8, type = "price", scale = 4 },
  { name = "trigger_price",    offset =  97, len =  8, type = "price", scale = 4 },
  { name = "mkt_order_flag",   offset = 105, len =  1, type = "bool_yn" },
  { name = "stop_loss_flag",   offset = 106, len =  1, type = "bool_yn" },
  { name = "fok_flag",         offset = 107, len =  1, type = "bool_yn", doc = "Fill-Or-Kill / IOC. Named 'FOK Flag' in CD, 'IO Flag' in CM/FAO" },
  { name = "spread_type",      offset = 108, len =  1, type = "str", values = ["S", "2", "3", "*"] },
  { name = "algo_indicator",   offset = 109, len =  1, type = "u8", values = [0, 1, 2, 3] },
  { name = "client_identity",  offset = 110, len =  1, type = "u8", values = [1, 2, 3] },
  { name = "limit_price_ind",  offset = 111, len =  1, type = "bool_yn", doc = "Added in spec 1.7" },
]

[[version]]
spec_version  = "1.6"
valid_from    = 2008-08-24
valid_to      = 2021-12-15
record_length = 111
verified      = false
fields = [
  { name = "record_indicator", offset =   0, len =  2, type = "str", values = ["RM"] },
  { name = "segment",          offset =   2, len =  4, type = "str", pad = "right", values = ["CDS"] },
  { name = "order_number",     offset =   6, len = 16, type = "u64" },
  { name = "txn_time",         offset =  22, len = 14, type = "jiffies" },
  { name = "buy_sell",         offset =  36, len =  1, type = "str", values = ["B", "S"] },
  { name = "activity_type",    offset =  37, len =  1, type = "u8", values = [1, 3, 4] },
  { name = "symbol",           offset =  38, len = 10, type = "str", pad = "left" },
  { name = "instrument",       offset =  48, len =  6, type = "str", values = ["FUTCUR", "OPTCUR"] },
  { name = "expiry_date",      offset =  54, len =  9, type = "date_dmmmy" },
  { name = "strike_price",     offset =  63, len =  8, type = "price", scale = 4 },
  { name = "option_type",      offset =  71, len =  2, type = "str", values = ["CA", "PA", "CE", "PE", "FF"] },
  { name = "volume_disclosed", offset =  73, len =  8, type = "u64" },
  { name = "volume_original",  offset =  81, len =  8, type = "u64" },
  { name = "limit_price",      offset =  89, len =  8, type = "price", scale = 4 },
  { name = "trigger_price",    offset =  97, len =  8, type = "price", scale = 4 },
  { name = "mkt_order_flag",   offset = 105, len =  1, type = "bool_yn" },
  { name = "stop_loss_flag",   offset = 106, len =  1, type = "bool_yn" },
  { name = "fok_flag",         offset = 107, len =  1, type = "bool_yn" },
  { name = "spread_type",      offset = 108, len =  1, type = "str", values = ["S", "2", "3", "*"] },
  { name = "algo_indicator",   offset = 109, len =  1, type = "u8", values = [0, 1, 2, 3] },
  { name = "client_identity",  offset = 110, len =  1, type = "u8", values = [1, 2, 3] },
]
